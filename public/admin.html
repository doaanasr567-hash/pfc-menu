<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P.F.C - لوحة التحكم</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0f0f0f;
      color: #f5f5f5;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e67e22;
    }
    .header h1 { color: #e67e22; font-size: 22px; }
    .header a {
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
    }
    .header a:hover { color: #e67e22; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .stat-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }
    .stat-card .number {
      font-size: 32px;
      font-weight: bold;
      color: #e67e22;
    }
    .stat-card .label { color: #aaa; margin-top: 6px; font-size: 14px; }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }
    .orders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 16px;
    }
    .orders-header h2 { font-size: 20px; }
    .refresh-btn {
      background: #e67e22;
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .refresh-btn:hover { background: #d35400; }
    .order-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .order-top {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .order-id { font-size: 13px; color: #888; }
    .order-date { font-size: 13px; color: #888; }
    .customer-info {
      margin-bottom: 12px;
      line-height: 1.7;
    }
    .customer-info strong { color: #e67e22; }
    .items-list {
      background: #0f0f0f;
      border-radius: 10px;
      padding: 12px;
      margin: 12px 0;
      font-size: 14px;
    }
    .items-list div { margin-bottom: 4px; }
    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }
    .total { font-size: 20px; font-weight: bold; color: #e67e22; }
    .status-select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0f0f0f;
      color: #fff;
      cursor: pointer;
    }
    .status-جديد { border-color: #3498db; color: #3498db; }
    .status-قيد-التحضير { border-color: #f39c12; color: #f39c12; }
    .status-خرج-للتوصيل { border-color: #9b59b6; color: #9b59b6; }
    .status-تم-التسليم { border-color: #27ae60; color: #27ae60; }
    .status-ملغي { border-color: #e74c3c; color: #e74c3c; }
    .delete-btn {
      background: transparent;
      border: 1px solid #e74c3c;
      color: #e74c3c;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .delete-btn:hover { background: #e74c3c; color: white; }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 18px;
    }
    .notes {
      background: #2a2a2a;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #ccc;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><i class="fas fa-utensils"></i> P.F.C - لوحة التحكم</h1>
    <a href="/"><i class="fas fa-home"></i> العودة للمنيو</a>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card">
      <div class="number" id="totalOrders">-</div>
      <div class="label">إجمالي الطلبات</div>
    </div>
    <div class="stat-card">
      <div class="number" id="todayOrders">-</div>
      <div class="label">طلبات اليوم</div>
    </div>
    <div class="stat-card">
      <div class="number" id="totalRevenue">-</div>
      <div class="label">إجمالي المبيعات (ج.م)</div>
    </div>
  </div>

  <div class="container">
    <div class="orders-header">
      <h2>الطلبات</h2>
      <button class="refresh-btn" onclick="loadOrders()">
        <i class="fas fa-sync-alt"></i> تحديث
      </button>
    </div>
    <div id="ordersList">
      <div class="empty">جاري التحميل...</div>
    </div>
  </div>

  <script>
    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        if (data.success) {
          document.getElementById('totalOrders').textContent = data.stats.totalOrders;
          document.getElementById('todayOrders').textContent = data.stats.todayOrders;
          document.getElementById('totalRevenue').textContent = data.stats.totalRevenue.toLocaleString();
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function loadOrders() {
      const list = document.getElementById('ordersList');
      list.innerHTML = '<div class="empty">جاري التحميل...</div>';

      try {
        const res = await fetch('/api/orders');
        const data = await res.json();

        if (!data.success || data.orders.length === 0) {
          list.innerHTML = '<div class="empty">مفيش طلبات لسه 🛒</div>';
          return;
        }

        list.innerHTML = data.orders.map(order => {
          const date = new Date(order.created_at).toLocaleString('ar-EG');
          const itemsHtml = order.items.map(i => 
            `<div>${i.emoji || ''} ${i.name} × ${i.qty} = ${i.price * i.qty} ج</div>`
          ).join('');

          return `
            <div class="order-card">
              <div class="order-top">
                <span class="order-id">#${order.id.slice(0, 8)}</span>
                <span class="order-date">${date}</span>
              </div>
              <div class="customer-info">
                <div><strong>الاسم:</strong> ${order.customer_name}</div>
                <div><strong>الموبايل:</strong> <a href="tel:${order.customer_phone}" style="color:#e67e22">${order.customer_phone}</a></div>
                <div><strong>العنوان:</strong> ${order.customer_address}</div>
                ${order.notes ? `<div class="notes"><strong>ملاحظات:</strong> ${order.notes}</div>` : ''}
              </div>
              <div class="items-list">${itemsHtml}</div>
              <div class="order-footer">
                <div class="total">${order.total} ج.م</div>
                <div style="display:flex; gap:10px; align-items:center;">
                  <select class="status-select status-${order.status}" onchange="updateStatus('${order.id}', this.value)">
                    <option value="جديد" ${order.status === 'جديد' ? 'selected' : ''}>جديد</option>
                    <option value="قيد التحضير" ${order.status === 'قيد التحضير' ? 'selected' : ''}>قيد التحضير</option>
                    <option value="خرج للتوصيل" ${order.status === 'خرج للتوصيل' ? 'selected' : ''}>خرج للتوصيل</option>
                    <option value="تم التسليم" ${order.status === 'تم التسليم' ? 'selected' : ''}>تم التسليم</option>
                    <option value="ملغي" ${order.status === 'ملغي' ? 'selected' : ''}>ملغي</option>
                  </select>
                  <button class="delete-btn" onclick="deleteOrder('${order.id}')">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        list.innerHTML = '<div class="empty">حصل خطأ في تحميل الطلبات</div>';
        console.error(e);
      }
    }

    async function updateStatus(id, status) {
      try {
        await fetch(`/api/orders/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        loadOrders();
        loadStats();
      } catch (e) {
        alert('حصل خطأ في تحديث الحالة');
      }
    }

    async function deleteOrder(id) {
      if (!confirm('متأكد إنك عايز تمسح الطلب ده؟')) return;
      try {
        await fetch(`/api/orders/${id}`, { method: 'DELETE' });
        loadOrders();
        loadStats();
      } catch (e) {
        alert('حصل خطأ');
      }
    }

    // Init
    loadStats();
    loadOrders();

    // Auto refresh every 30 seconds
    setInterval(() => {
      loadOrders();
      loadStats();
    }, 30000);
  </script>
</body>
</html>
